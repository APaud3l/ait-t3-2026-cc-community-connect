
<!DOCTYPE html>
<html>
<head>
    <title>CommunityConnect</title>
    <style>
        body { font-family: Arial; max-width: 700px; margin: 40px auto; }
        .event { border: 1px solid #ddd; padding: 20px; margin: 15px 0; }
        a { color: #0066cc; }
    </style>
</head>
<body>
    <h1>CommunityConnect</h1>
    <p>Discover and register for community events.</p>

    <h2>Upcoming Events</h2>

    {% for event in events %}
    <div class="event">
        <h3>{{ event.title }}</h3>
        <p>Date: {{ event.event_date }}</p>
        <p>Location: {{ event.location }}</p>
        <a href="{{ url_for('register', event_id=event.id) }}">
            Register
        </a>
    </div>
    {% endfor %}
</body>
</html>
